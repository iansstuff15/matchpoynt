# Serves the built SPA. Runs as a non-root user on a read-only filesystem:
# pid and temp files go to the /tmp tmpfs, logs to the host volume.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/matchpoynt/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/matchpoynt/access.log;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed build assets never change.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
