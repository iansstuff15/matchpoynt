[package]
name = "matchpoynt"
version = "0.1.0"
description = "Matchpoynt desktop app for court sessions, queues and rankings"
authors = ["Matchpoynt"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "matchpoynt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
